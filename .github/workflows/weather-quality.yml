name: Cloud weather quality

on:
  push:
    paths:
      - 'cloud_collector/**'
      - 'functions_weather_watchdog/**'
      - 'firebase.weather-watchdog.json'
      - '.github/workflows/RecolteMeteo.yml'
      - '.github/workflows/weather-quality.yml'
  pull_request:
    paths:
      - 'cloud_collector/**'
      - 'functions_weather_watchdog/**'
      - 'firebase.weather-watchdog.json'
      - '.github/workflows/RecolteMeteo.yml'
      - '.github/workflows/weather-quality.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collector-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le code sans credentials persistants
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cloud_collector/requirements-harvest.txt
      - name: Installer les dependances serveur
        run: |
          python -m pip install --disable-pip-version-check -r cloud_collector/requirements-harvest.txt
          python -m pip check
      - name: Tester les pannes et les contrats
        working-directory: cloud_collector
        run: python -m unittest discover -s tests_python -p 'test_*.py'

  independent-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le code sans credentials persistants
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions_weather_watchdog/package-lock.json
      - name: Installer et auditer les dependances du moniteur
        working-directory: functions_weather_watchdog
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Tester le moniteur sans services externes
        working-directory: functions_weather_watchdog
        run: npm test
