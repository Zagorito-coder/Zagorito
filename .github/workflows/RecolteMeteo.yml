name: RecolteMeteoQuotidienne

on:
  schedule:
    # Quatre renouvellements complets ; récupération horaire ciblée en complément.
    - cron: '17 0,6,12,18 * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Collecte, récupération ciblée, diagnostic ou préparation sans écriture'
        type: choice
        options: [collect, recover, health, dry-run]
        default: collect
      station_ids:
        description: 'Identifiants séparés par des virgules ; vide = tout le catalogue'
        type: string
        default: ''

permissions:
  contents: read

# Même verrou pour collecte complète et reprise : aucune double collecte concurrente.
concurrency:
  group: recolte-meteo-production
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cloud_collector
    steps:
      - name: Recuperer le code du depot
        working-directory: .
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cloud_collector/requirements-harvest.txt

      - name: Installer les dependances
        run: |
          python -m pip install --disable-pip-version-check -r requirements-harvest.txt
          python -m pip check

      - name: Tester les contrats et la recuperation
        run: python -m unittest discover -s tests_python -p 'test_*.py'

      - name: Recreer la cle Firebase depuis le secret GitHub
        shell: bash
        env:
          FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_KEY_JSON" > firebase-key.json

      - name: Collecter ou recuperer les stations
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          FORECAST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          COLLECTOR_EVENT_SCHEDULE: ${{ github.event.schedule }}
          COLLECTOR_INPUT_MODE: ${{ inputs.mode }}
          COLLECTOR_STATION_IDS: ${{ inputs.station_ids }}
        shell: bash
        run: |
          mode="${COLLECTOR_INPUT_MODE:-collect}"
          if [ "$COLLECTOR_EVENT_SCHEDULE" = '47 * * * *' ]; then
            mode=recover
          fi
          args=(--mode "$mode" --station-ids "$COLLECTOR_STATION_IDS" --report-file collector-report.json)
          if [ "$mode" = dry-run ]; then
            args+=(--fixture-file collector-fixtures.json)
          fi
          python -u collector_runtime.py "${args[@]}"

      - name: Archiver le rapport sanitaire sans secrets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collector-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cloud_collector/collector-report.json
            cloud_collector/collector-fixtures.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Nettoyer la cle (securite)
        if: always()
        run: rm -f firebase-key.json
