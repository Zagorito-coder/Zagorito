name: RecolteMeteoQuotidienne

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'   # 4x/jour : 00h, 06h, 12h, 18h UTC (donnees fraiches toutes les 6h)
  workflow_dispatch:       # bouton "Run workflow" manuel dans GitHub

# Le workflow lit le dépôt mais ne doit jamais pouvoir pousser de code.
permissions:
  contents: read

# Une récolte lente ne doit jamais chevaucher la suivante et doubler les appels
# API/écritures Firestore. La seconde exécution attend la première.
concurrency:
  group: recolte-meteo-production
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Recuperer le code du depot
        # v7.0.1 — SHA immuable pour éviter le remplacement d'un tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Installer Python
        # v7.0.0 — SHA immuable vérifié depuis le dépôt officiel.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-harvest.txt

      - name: Auditer les dependances Python
        # pypa/gh-action-pip-audit v1.1.0 — action PyPA officielle épinglée.
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-harvest.txt

      - name: Installer les dependances
        run: |
          python -m pip install --disable-pip-version-check -r requirements-harvest.txt
          python -m pip check

      - name: Tester la résilience du script
        run: python -m unittest discover -s tests_python -p 'test_*.py'

      - name: Verifier la cle Open-Meteo commerciale
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: |
          if [ -z "${OPEN_METEO_API_KEY//[[:space:]]/}" ]; then
            echo "::error::Le secret OPEN_METEO_API_KEY est obligatoire pour l'API commerciale."
            exit 1
          fi

      - name: Recreer la cle Firebase depuis le secret GitHub
        shell: bash
        env:
          FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_KEY_JSON" > firebase-key.json

      - name: Executer le script de recolte
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python -u harvest_forecast.py

      - name: Nettoyer la cle (securite)
        if: always()
        run: rm -f firebase-key.json
