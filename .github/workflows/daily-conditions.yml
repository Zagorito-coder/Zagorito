name: Daily fishing conditions

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

# Ce job ne doit jamais pouvoir modifier le dépôt.
permissions:
  contents: read

concurrency:
  group: daily-fishing-conditions-production
  cancel-in-progress: false

jobs:
  update-conditions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout du dépôt
        # Dépôt public : aucun jeton ni credential Git persistant. Le checkout
        # natif évite aussi d'interpréter le gitlink historique
        # spots_app_temp, qui n'est utilisé par aucun job.
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Installation de Node.js
        # actions/setup-node v7.0.0 — SHA immuable et runtime Node 24.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installation des dépendances
        working-directory: functions
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Vérification du secret Open-Meteo commercial
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: |
          if [ -z "${OPEN_METEO_API_KEY//[[:space:]]/}" ]; then
            echo "::error::Le secret OPEN_METEO_API_KEY est obligatoire pour l'API commerciale."
            exit 1
          fi

      - name: Récupération des conditions et écriture dans Firestore
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: node run-once.js
