name: Daily fishing conditions

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

# Ce job ne doit jamais pouvoir modifier le dépôt.
permissions:
  contents: read

concurrency:
  group: daily-fishing-conditions-production
  cancel-in-progress: false

jobs:
  update-conditions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout du dépôt
        # SHA immuable du tag officiel actions/checkout v4.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Installation de Node.js
        # SHA immuable du tag officiel actions/setup-node v4.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installation des dépendances
        working-directory: functions
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Vérification du secret Open-Meteo commercial
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: |
          if [ -z "${OPEN_METEO_API_KEY//[[:space:]]/}" ]; then
            echo "::error::Le secret OPEN_METEO_API_KEY est obligatoire pour l'API commerciale."
            exit 1
          fi

      - name: Récupération des conditions et écriture dans Firestore
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: node run-once.js
